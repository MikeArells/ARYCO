<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión | Arellano & Cía</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="Static/style.css" />
</head>
<body>
  <section class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-6 bg-white rounded-4 shadow p-4">
        <h1 class="mb-4">Iniciar sesión</h1>
        <p>Bienvenido a la sección de registro, por el momento solo los administradores pueden acceder.</p>
        <form id="loginForm">
          <div class="mb-3">
            <label for="email" class="form-label">Correo electrónico</label>
            <input type="email" class="form-control" id="email" placeholder="tu@correo.com" required>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="password" placeholder="Contraseña" required>
          </div>
          <div class="mb-3 text-danger" id="loginError" style="display:none;"></div>
          <button type="submit" class="btn btn-primary">Entrar</button>
          <a href="index.html" class="btn btn-link">Volver al inicio</a>
        </form>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>   <!-- hecho por GPT -->
  <script src="JS/supabaseClient.js"></script>
  <script src="JS/auth.js"></script>
</body>
</html>
