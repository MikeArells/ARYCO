<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subir propiedad | Arellano & Cía</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="Static/style.css" />
</head>

<body>
  <section class="container-fluid">
    <div class="row min-vh-100">

      <!-- SIDEBAR -->
      <div class="col-12 col-md-3 col-lg-2 bg-dark text-white p-3">
        <h4 class="mb-4">Panel</h4>
        <ul class="nav flex-column" id="menuTabs">
          <li class="nav-item">
            <button class="nav-link text-white active" data-tab="registro">Registro</button>
          </li>
          <li class="nav-item">
            <button class="nav-link text-white" data-tab="editar">Editar / Borrar</button>
          </li>
          <li class="nav-item">
            <button class="nav-link text-white" data-tab="analysis">Analisis</button>
          </li>
        </ul>
        <button type="button" class="btn btn-secondary" id="logoutButton">Cerrar sesión</button>
      </div>

      <!---------- TAB 1: REGISTRO DE PROPIEDADES    ----------->
      
      <div class="col-12 col-md-9 col-lg-10 p-4">

        <div class="tab-content" id="registro">
          <h1 class="mb-4">Subir una propiedad</h1>
          <p>Completa los datos de la propiedad.</p>
          <div id="successMessage" class="alert alert-success" style="display:none;"></div>
          <div id="errorMessage" class="alert alert-danger" style="display:none;"></div>
          <form id="propertyForm">

            <div class="row g-3">

              <div class="col-md-6">
                <label for="titulo" class="form-label">Título</label>
                <input type="text" class="form-control" id="titulo" required>
              </div>

              <div class="col-md-6">
                <label for="subtitulo" class="form-label">Subtítulo</label>
                <input type="text" class="form-control" id="subtitulo" required>
              </div>

              <div class="col-md-6">
                <label for="transaccion" class="form-label">Transacción</label>
                <select id="transaccion" class="form-select" required>
                  <option value="">Selecciona</option>
                  <option value="EN VENTA">En venta</option>
                  <option value="EN RENTA">En renta</option>
                </select>
              </div>

              <div class="col-md-6">
                <label for="precio" class="form-label">Precio</label>
                <input type="number" class="form-control" id="precio" step="0.01" required>
              </div>

              <div class="col-md-6">
                <label for="tipoPropiedad" class="form-label">Tipo de propiedad</label>
                <select id="tipoPropiedad" class="form-select" required>
                  <option value="">Selecciona</option>
                  <option value="CASA">Casa</option>
                  <option value="DEPARTAMENTO">Departamento</option>
                  <option value="BODEGA">Bodega</option>
                  <option value="TERRENO">Terreno</option>
                  <option value="NAVE INDUSTRIAL">Nave Industrial</option>
                  <option value="RANCHO">Rancho</option>
                  <option value="EDIFICIO">Edificio</option>
                </select>
              </div>

              <div class="col-md-6">
                <label for="terreno" class="form-label">Terreno (m²)</label>
                <input type="number" step="0.01" class="form-control" id="terreno">
              </div>

              <div class="col-md-6">
                <label for="construccion" class="form-label">Construcción (m²)</label>
                <input type="number" step="0.01" class="form-control" id="construccion">
              </div>

              <div class="col-md-6">
                <label for="ocupacion" class="form-label">Ocupación</label>
                <input type="text" class="form-control" id="ocupacion">
              </div>

              <div class="col-md-6">
                <label for="pago" class="form-label">Forma de pago</label>
                <input type="text" class="form-control" id="pago">
              </div>
              
              <div class="col-12">
                <label for="descripcion" class="form-label">Descripción</label>
                <textarea class="form-control" id="descripcion" rows="4" style="height: 200px;"></textarea>
              </div>

              <div class="col-md-6">
                <label for="maps_url" class="form-label">URL de Google Maps</label>
                <input type="url" class="form-control" id="maps_url" placeholder="https://maps.google.com/...">
              </div>

              <div class="col-md-6">
                <label for="video" class="form-label">URL de Video (YouTube, etc.)</label>
                <input type="url" class="form-control" id="video" placeholder="https://youtube.com/...">
              </div>

              <div class="col-12">
                <label for="servicios" class="form-label">Servicios (coma separados o JSON simple)</label>
                <textarea class="form-control" id="servicios" rows="3"></textarea>
              </div>

              <div class="col-md-4">
                <label for="recamaras" class="form-label">Recámaras</label>
                <input type="number" class="form-control" id="recamaras">
              </div>

              <div class="col-md-4">
                <label for="banos" class="form-label">Baños</label>
                <input type="number" class="form-control" id="banos">
              </div>

              <div class="col-md-4">
                <label for="carros" class="form-label">Cajones</label>
                <input type="number" class="form-control" id="carros">
              </div>

              <div class="col-12">
                <label for="imagenes" class="form-label">Imágenes de la propiedad</label>
                <input type="file" class="form-control" id="imagenes" multiple accept="image/*">
                <small class="text-muted">Puedes seleccionar varias imágenes</small>
              </div>

            </div>
            
            <div class="mt-4">
              <button type="submit" class="btn btn-primary">Enviar propiedad</button>
              
            </div>

          </form>
        </div>

          <!---------- TAB 2: EDITAR ----------->
        <div class="tab-content d-none" id="editar">
          <h1>Editar / Borrar propiedades</h1>
          
                  <!-- LISTA DE PROPIEDADES -->
          <div id="propertyList" class="row g-3 mt-3"></div>

          <hr>

                  <!-- FORM DE EDICIÓN -->
          <div id="editSection" class="mt-4 d-none">
            <h4>Editar propiedad</h4>

            <input type="hidden" id="editId">

            <div class="mb-3">
              <label>Título</label>
              <input type="text" id="editTitulo" class="form-control">
            </div>

            <div class="mb-3">
              <label>Subtitulo</label>
              <input type="text" id="editSubtitulo" class="form-control">
            </div>

            <div class="mb-3">
              <label>Transacción</label>
              <input type="text" id="editTransaccion" class="form-control">
            </div>

            <div class="mb-3">
              <label>Precio</label>
              <input type="number" id="editPrecio" class="form-control">
            </div>

            <div class="mb-3">
              <label>Tipo de propiedad</label>
              <input type="text" id="editTipoPropiedad" class="form-control">
            </div>

            <div class="mb-3">
              <label>Terreno</label>
              <input type="text" id="editTerreno" class="form-control">
            </div>

            <div class="mb-3">
              <label>Construccion</label>
              <input type="text" id="editConstruccion" class="form-control">
            </div>

            <div class="mb-3">
              <label>Ocupacion</label>
              <input type="text" id="editOcupacion" class="form-control">
            </div>

            <div class="mb-3">
              <label>Forma de pago</label>
              <input type="text" id="editPago" class="form-control">
            </div>

            <div class="mb-3">
              <label>Descripcion</label>
              <textarea class="form-control" id="editDescripcion" rows="4" style="height: 150px;"></textarea>
            </div>

            <div class="mb-3">
              <label>URL de Google Maps</label>
              <input type="text" id="editGoogleMaps" class="form-control">
            </div>

            <div class="mb-3">
              <label>URL de videos</label>
              <input type="text" id="editVideos" class="form-control">
            </div>

            <div class="mb-3">
              <label>Servicios</label>
              <input type="text" id="editServicios" class="form-control">
            </div>

            <div class="mb-3">
              <label>Recamaras</label>
              <input type="number" id="editRecamaras" class="form-control">
            </div>

            <div class="mb-3">
              <label>Baños</label>
              <input type="number" id="editBanos" class="form-control">
            </div>

            <div class="mb-3">
              <label>Cajones</label>
              <input type="number" id="editCarros" class="form-control">
            </div>

            <button class="btn btn-success" id="updateBtn">Actualizar</button>
            <button class="btn btn-danger" id="deleteBtn">Borrar</button>
          </div>

        </div>

          <!-- TAB 3: ANALYSIS -->
        <div class="tab-content d-none" id="analysis">
          <h1>Analysis</h1>
          <p>Aquí puedes meter estadísticas, gráficas, etc.</p>
        </div>

      </div>

    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script> 
  <script src="JS/supabaseClient.js"></script>
  <script src="JS/upload.js"></script>
</body>
</html>
